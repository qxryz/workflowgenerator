structured-info:
  zh-CN:
    summary: 将品牌Logo、名称与标语转成文字准确、点阵风格统一的横版品牌图和短片动效。
    best-for:
      - 点阵字形
      - Logo动效
      - 品牌开场
    how-to-use: 提供Logo或品牌视觉图及准确文字，先确认横版品牌图中的文字和点阵运动方向。
    outputs: 横版品牌图、独立动效提示词、品牌文字映射与点阵动效视频。
  en-US:
    summary: Transform a logo, brand name, and slogan into an accurate horizontal brand plate and a cohesive dot-matrix motion short.
    best-for:
      - Dot-matrix Type
      - Logo Motion
      - Brand Openers
    how-to-use: Provide the logo or brand visual with exact text, then confirm the wording and dot-matrix movement for the horizontal plate.
    outputs: A horizontal brand plate, standalone motion prompt, text mapping, and dot-matrix motion video.
