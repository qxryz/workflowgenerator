structured-info:
  zh-CN:
    summary: 将知识主题制作成纸偶、分层布景和定格动作组成的科普视频创作包，强调纸材质与空间深度。
    best-for:
      - 纸艺科普
      - 定格动画
      - 分层布景
    how-to-use: 提供知识主题或讲解稿，先确认受众、画幅、纸艺风格和需要解释的核心概念。
    outputs: 纸偶与场景设定、分层分镜、动作提示词、旁白音效方案与制作包。
  en-US:
    summary: Turn a knowledge topic into a papercraft explainer package built from paper figures, layered sets, and stop-motion movement.
    best-for:
      - Papercraft Explainers
      - Stop Motion
      - Layered Sets
    how-to-use: Provide the knowledge topic or script, then confirm audience, framing, paper style, and the core concept to explain.
    outputs: Paper character and set designs, layered storyboard, motion prompts, narration and sound direction, and a production package.
