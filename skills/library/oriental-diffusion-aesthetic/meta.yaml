structured-info:
  zh-CN:
    summary: 将上传主体转成保留轮廓与色域的东方弥散静图，确认后延展为克制的固定机位循环视频。
    best-for:
      - 东方美学
      - 弥散静图
      - 循环短视频
    how-to-use: 提供商品、人物或角色图，先确认主体锚点、画幅与暗底纸感的视觉方向。
    outputs: 主体分析、东方弥散静图、视频延展提示词与克制循环短片。
  en-US:
    summary: Transform an uploaded subject into an Eastern diffusion still that preserves silhouette and palette, then optionally extend it into a restrained loop.
    best-for:
      - Eastern Aesthetics
      - Diffusion Stills
      - Looping Shorts
    how-to-use: Provide a product, person, or character image, then confirm subject anchors, framing, and the dark paper-like visual direction.
    outputs: Subject analysis, Eastern diffusion still, video-extension prompt, and restrained looping short.
