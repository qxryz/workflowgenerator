summary-en: "Transforms an uploaded image into an Eastern diffusion still, then optionally extends the approved still into a restrained short video."
summary-cn: "先将上传图转成东方弥散静图，确认后再延展为克制的循环短视频，保持主体色域与轮廓。"
desc-en: "For creators who want an uploaded product, person, object, animal, or character turned into an Eastern diffusion poster before optional motion. The workflow extracts the silhouette and visual anchors, keeps the source color gamut, simplifies the background into a dark paper-like base, and confirms the still image first. If video is requested, it uses a fixed camera, keeps the subject stable, and creates a relay-style outward color wave within the source palette. MiniMax-H3 is the default video model; an explicitly selected alternative is capability-checked, retried once on failure, then replaced by another available model. Not for full ads, KOC content, or multi-shot stories."
desc-cn: "用于把上传的商品、人物、器物、动物或角色图先转成东方弥散静图，再在确认后延展为短视频。流程提取主体轮廓和关键锚点，保留原图已有色域，把背景压成暗底纸感并完成居中、符号化构图；静图确认后才进入视频阶段。视频默认使用 MiniMax-H3，固定机位、主体基本不动，只在原图色域内做接力式外涌循环。用户明确指定其他模型时先检查能力，失败针对原因重试一次后切换其他可用模型。不适合完整广告、KOC 或多镜头剧情。"
