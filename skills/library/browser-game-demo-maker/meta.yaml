structured-info:
  zh-CN:
    summary: 先制作保留完整浏览器外壳的游戏截图锚点，再生成只在画布内变化的连续浏览器游戏演示视频。
    best-for:
      - 浏览器游戏
      - 截图锚点
      - 游戏演示
    how-to-use: 提供本地游戏页面、角色参考、界面文案和动作顺序，先锁定浏览器窗口与截图契约。
    outputs: 浏览器截图锚点、界面文案、动作时间线、匹配演示视频与独立交付素材。
  en-US:
    summary: Create a browser-game screenshot anchor with the full browser shell, then animate only the canvas for a matching demo video.
    best-for:
      - Browser Games
      - Screenshot Anchors
      - Game Demos
    how-to-use: Provide the local game page, character reference, interface copy, and action order, then lock the browser frame and screenshot contract.
    outputs: A browser screenshot anchor, interface copy, action timeline, matching demo video, and separate delivery assets.
