structured-info:
  zh-CN:
    summary: 先用无声几何预演验证镜头与空间调度，再结合完整外观参考制作身份和视觉风格一致的短片。
    best-for: [镜头预演, 空间调度, 风格化短片]
    how-to-use: 提供故事、三维工程或现有预演，先确认分镜与所需外观参考。
    outputs: 无声白模预演、可编辑工程、同步分镜提示词及成片。
  en-US:
    summary: Validate camera work and spatial choreography with silent geometric previs, then use complete appearance references to create a consistent stylized film.
    best-for: [Shot Previs, Spatial Choreography, Stylized Films]
    how-to-use: Provide a story, Blender project, or existing previs, then approve shots and required appearance references.
    outputs: Silent geometric previs, editable project, synchronized shot prompts, and a completed film.
