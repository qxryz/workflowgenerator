summary-en: "Adds a referenced object to a mime-acting video while preserving the original person, scene, camera, timing, and performance."
summary-cn: "把参考物品自然加入无实物表演视频，同时保持人物、场景、镜头与动作不变。"
desc-en: "For creators who film a person acting without a physical prop and want one to three referenced objects inserted on a chosen body area. The workflow analyzes source motion, visibility, lighting, camera movement, and object structure, creates an optional placement anchor, then generates an edit that preserves the original person, scene, timing, and performance while maintaining plausible scale, perspective, contact, shadow, occlusion, and continuity. MiniMax-H3 is the default video model; an explicitly selected alternative is capability-checked, retried once on failure, then replaced by another available model. It is not for full scene redesign, product ads, or multi-shot production."
desc-cn: "面向拍摄无实物表演素材、希望把 1–3 件参考物品自然加入指定身体部位的创作者。流程先分析源视频动作、目标部位可见性、光线、镜头运动和物品结构，必要时生成物品放置锚点，再进行保留优先的视频编辑。最终应保持原人物、服装、场景、镜头、节奏和动作不变，并让物品具备合理比例、透视、接触、阴影、遮挡和运动连续性。视频默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败针对原因重试一次后切换其他可用模型。不用于完整场景重设计、产品广告或多镜头成片。"
