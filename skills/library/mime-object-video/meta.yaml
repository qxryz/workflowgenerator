structured-info:
  zh-CN:
    summary: 将参考物品自然加入无实物表演视频，同时保护人物、场景、镜头和动作的原有连续性。
    best-for:
      - 物品置入
      - 视频编辑
      - 产品佩戴
    how-to-use: 提供表演源视频、物品参考图和目标身体部位，先检查可见性、动作和透视可行性。
    outputs: 源视频分析、物品锚点、编辑简报、增强视频与连续性复核。
  en-US:
    summary: Naturally add a reference object to a prop-free performance video while protecting the original person, scene, camera, and action continuity.
    best-for:
      - Object Insertion
      - Video Editing
      - Wearable Products
    how-to-use: Provide the performance video, object references, and target body location, then check visibility, action, and perspective feasibility.
    outputs: Source analysis, object anchors, edit brief, enhanced video, and continuity review.
