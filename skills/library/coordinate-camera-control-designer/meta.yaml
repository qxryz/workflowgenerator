display-name-zh: 坐标运镜分镜设计师
version: 0.1.7
tag-en: "Commercial Ad / Planning"
tag-cn: "商业广告 / 计划制定"
summary-en: "Convert action scenes into coordinate-based camera-control prompts and storyboard planning assets."
summary-cn: "坐标化运镜与分镜规划"
desc-en: "Coordinate-based camera control and visual storyboarding. Converts subject position, movement targets, impact points, and camera follow, push, pull, pan, and tilt directives into controllable [L,T,W,H] coordinate prompts. Generates a 4K scene motion-path overview image and a black-and-white line-art 3x3 master storyboard, then outputs Seedance video camera-motion prompts with embedded coordinate control for reliable action, chase, and fight-beat execution."
desc-cn: "坐标运镜与可视化分镜。把主体位置、运动目标、撞击点、镜头跟随/推拉摇移转写成可控的 [L,T,W,H] 坐标提示词；生成 4K 场景运动轨迹图与黑白线稿 3x3 总分镜，输出带坐标控制的 Seedance 视频运镜提示词；适合动作、追逐、打斗、撞击等高速动作场面。"
complete-tags-en:
  - "Commercial Ad / Planning"
  - "Animation / Planning"
complete-tags-cn:
