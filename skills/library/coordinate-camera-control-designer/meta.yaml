  - "动画 / 计划制定"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
cover: "https://cdn.hailuoai.com/hailuo-video-web/public_assets/500c4998-65ac-49a5-8518-dbbb18ce1138.mp4"
structured-info:
  zh-CN:
    summary: 将动作、空间和镜头路径转成可检查的坐标化运镜分镜，帮助高速场面保持位置与运动逻辑。
    best-for:
      - 坐标运镜
      - 动作分镜
      - 空间控制
    how-to-use: 提供场景、主体动作和镜头意图，先确认画面边界、运动目标与撞击节点。
    outputs: 运动轨迹图、黑白分镜、坐标提示词与可执行的运镜方案。
  en-US:
    summary: Translate action, space, and camera paths into coordinate-based storyboards that preserve spatial and motion logic in fast scenes.
    best-for:
      - Coordinate Camera
      - Action Storyboards
      - Spatial Control
    how-to-use: Provide the scene, subject action, and camera intent, then confirm frame boundaries, motion targets, and impact points.
    outputs: A trajectory diagram, monochrome storyboard, coordinate prompts, and an executable camera plan.
