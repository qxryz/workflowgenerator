structured-info:
  zh-CN:
    summary: 将IP草稿或简报分步扩展为角色、表情、服装、海报和周边组成的可复用品牌资产包。
    best-for:
      - IP资产包
      - 角色扩展
      - 文创周边
    how-to-use: 提供IP草稿、参考图或文字设想，先确认角色身份、资产范围和模块顺序。
    outputs: IP基础形象、表情包、服装与场景海报、周边设计及资产包清单。
  en-US:
    summary: Expand an IP sketch or brief into a reusable brand asset package spanning character, expressions, outfits, posters, and merchandise.
    best-for:
      - IP Asset Packs
      - Character Extensions
      - Merchandise Design
    how-to-use: Provide an IP sketch, references, or written concept, then confirm identity, asset scope, and module order.
    outputs: A core IP character, expression pack, outfits and scene posters, merchandise designs, and an asset inventory.
