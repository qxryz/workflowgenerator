summary-en: "Turns sitcom premises, scripts, or references into continuity-safe shorts with comic beats, shot prompts, production QA, and optional post-final instrumental BGM design."
summary-cn: "把情景喜剧素材整理成含喜剧节拍、镜头提示词、连续性检查和成片后纯器乐 BGM 设计的短片制作包。"
desc-en: "For creators making narrative AI sitcom shorts from a premise, script, storyboard, or visual references. The workflow locks production choices, a durable comic engine, and a retro indoor television look; builds continuity-safe character, set, and prop bibles; prepares a timed beat sheet, cut map, shot prompts, and review assets; then guides shot generation, variant selection, tail-frame handoffs, editing, audio intelligibility, and final QA. Optional instrumental BGM is designed only after the first final cut. MiniMax-H3 is the default video model; an explicitly selected alternative is capability-checked, retried once for the diagnosed failure, then replaced by another available model. Best for short situation comedies, not standalone images, generic prompts, or long-form drama."
desc-cn: "面向制作叙事型 AI 情景喜剧短片的创作者，可输入梗概、剧本、分镜或视觉参考。流程先锁定制作规格、喜剧引擎和复古室内电视风格，建立角色、场景与道具连续性锚点，再编写时间化节拍表、剪辑图和逐镜提示词，审核中间资产后逐镜生成、筛选版本、衔接尾帧并完成剪辑与声音验收。需要时可在成片后加入带时间码的纯器乐 BGM。视频默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败按原因重试一次后切换可用模型。适合情景喜剧短片，不用于单图、泛化提示词或长篇剧情制作。"
