structured-info:
  zh-CN:
    summary: 将梗概、剧本、分镜或视觉参考转化为角色场景连续、喜剧节拍明确且可执行的情景喜剧短片制作包。
    best-for:
      - 情景喜剧
      - 叙事短片
      - 喜剧节拍
    how-to-use: 提供梗概、剧本、分镜或视觉参考，确认规格、喜剧引擎、视觉预设与声音方案。
    outputs: 角色场景圣经、节拍表、剪辑图、逐镜提示词、质检方案及可选成片配乐。
  en-US:
    summary: Turn a premise, script, storyboard, or visual reference into an executable sitcom production package with consistent characters, sets, and comic beats.
    best-for:
      - Sitcom Shorts
      - Narrative Comedy
      - Comic Timing
    how-to-use: Provide a premise, script, storyboard, or visual references, then confirm format, comic engine, visual preset, and sound approach.
    outputs: Character and set bibles, beat sheet, cut map, shot prompts, QA guidance, and optional final-cut music.
