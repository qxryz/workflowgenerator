structured-info:
  zh-CN:
    summary: 将产品与品牌参考编排为带多视角、九宫格分镜、产品贴字和配乐的完整横版TVC。
    best-for:
      - 产品TVC
      - 贴字动画
      - 品牌排版
    how-to-use: 提供产品图、品牌参考和卖点文字，先确认产品身份、文字内容、画幅与五步制作范围。
    outputs: 产品多视角图、九宫格分镜、分段视频、贴字方案、配乐与TVC成片。
  en-US:
    summary: Turn product and brand references into a horizontal TVC with multi-view assets, a grid storyboard, kinetic type, and music.
    best-for:
      - Product TVCs
      - Kinetic Type
      - Brand Layout
    how-to-use: Provide product images, brand references, and selling-point copy, then confirm identity, exact text, framing, and the five-stage scope.
    outputs: Product multi-views, a grid storyboard, video segments, type direction, music, and the finished TVC.
