summary-en: "Audit skill quality and structure"
summary-cn: "审查Skill的质量与结构"
desc-en: "For auditing the quality and structure of an existing skill before publishing to the skill market. Takes a SKILL.md file or skill directory as input material. Produces a read-only quality report covering structure compliance, description quality assessment, trigger-word coverage analysis and best-practice conformance. Delivers an overall score with prioritized improvement suggestions for reaching publication standards."
desc-cn: "适用于发布前对已写好的 Skill 做质量审查的场景,确保达到上架标准。输入 SKILL.md 文件或 skill 目录,输出只读的质量审查报告。报告覆盖结构合规性检查、描述质量评估、触发词覆盖度分析、最佳实践合规性校验,并给出综合评分与优先级排序的改进建议,帮助作者高效提升 Skill 质量。"
cover: ""
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 审查Skill的触发描述、工作流结构、市场字段和中英对齐情况，输出上架前的质量判断。
    best-for:
      - Skill审查
      - 元数据质检
      - 上架检查
    how-to-use: 提供Skill文件与市场元数据，先运行机器校验，再按结构、触发、内容和引用逐项审查。
    outputs: 结构与字段审查报告、问题分级、对齐检查、校验结果与优先改进建议。
  en-US:
    summary: Review a Skill’s triggering, workflow structure, market fields, and bilingual alignment to assess publishing readiness.
    best-for:
      - Skill Audits
      - Metadata QA
      - Pre-publish Review
    how-to-use: Provide the Skill files and market metadata, then run machine checks before reviewing structure, triggers, content, and references.
    outputs: A structure and field report, prioritized issues, alignment checks, validation findings, and improvement recommendations.
