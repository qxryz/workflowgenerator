structured-info:
  zh-CN:
    summary: 让真实照片先保留空间与生命感自然运动，再由笔触显影主体，形成实景与手绘叠合的短片。
    best-for:
      - 照片动效
      - 手绘显影
      - 实景融合
    how-to-use: 提供实景照片和需要显影的主体，先确认运动范围、笔触层级与遮挡关系。
    outputs: 实景运动方案、手绘层结构、显影提示词与手绘融合短片。
  en-US:
    summary: Animate a real photo while preserving its space and life, then reveal the moving subject through a hand-drawn layer.
    best-for:
      - Photo Motion
      - Sketch Reveal
      - Live-action Fusion
    how-to-use: Provide the scene photo and subject to reveal, then confirm motion range, sketch layers, and occlusion relationships.
    outputs: A live-action motion plan, sketch-layer structure, reveal prompts, and the fused short.
