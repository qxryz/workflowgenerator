summary-en: "Turns real photos, videos, or text scenes into sketch-motion clips where a marker reveals a moving subject as hand-drawn art."
summary-cn: "让真实照片先自然动起来，再由笔尖把运动主体显影成手绘短片，保留实景空间与生命感。"
desc-en: "Creates short live-action sketch-motion clips from a real photo, reference video, or text scene. Text-only input first receives a realistic preview for spatial confirmation; the approved workflow then uses natural pre-drawing motion, marker-tip reveal, living subjects, restrained hand framing, colored-pencil texture, and subtle background motion. MiniMax-H3 is the default video model, while another model requires explicit user selection and a capability check."
desc-cn: "面向想把实景照片、参考视频或文字场景做成短视频手绘显影效果的创作者。纯文字输入会先生成真实预览，用于确认空间、主体位置和遮挡关系，再产出制作方案与详细提示词，确认后生成视频。规则强调手绘前先自然视频化、笔尖同步显影、主体转换前中后持续运动、手从边缘克制入画、彩铅或蜡笔排线质感、背景生活化微动与主体完整可见。默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力再执行，失败后切换可用模型。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official-featured
