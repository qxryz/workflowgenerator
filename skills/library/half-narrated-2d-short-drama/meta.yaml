structured-info:
  zh-CN:
    summary: 将2D短剧剧本整理为旁白与对白双声道的分镜和素材包，便于用户继续剪辑成片。
    best-for:
      - 2D漫剧
      - 旁白对白
      - 可剪辑素材
    how-to-use: 提供故事或剧本、角色与画风参考，先锁定旁白窗口、对白窗口和单集规格。
    outputs: 双通道脚本、角色与场景锚点、分镜、对白视频、旁白音频和剪辑包。
  en-US:
    summary: Turn a 2D short-drama script into a storyboard and asset package with separate narration and dialogue channels for editing.
    best-for:
      - 2D Manhua
      - Narration and Dialogue
      - Editable Assets
    how-to-use: Provide the story or script with character and style references, then lock narration windows, dialogue windows, and episode specs.
    outputs: A two-channel script, character and scene anchors, storyboard, dialogue video, narration audio, and an edit package.
