complete-tags-cn:
  - "动画 / 创作生成"
summary-en: "Guide users from uploaded photos to deliberately failed primitive low-poly images and optional short videos."
summary-cn: "引导用户上传照片，生成故意失败的原始低模图像，并可继续延展成笨拙运镜短视频。"
desc-en: "For creators who want an intentionally cheap and awkward early-3D reconstruction rather than polished low-poly art. The Skill first guides users to upload a photo or source image unless they explicitly ask for a new scene, then extracts broad anchors such as subject count, layout, action, camera, scene type, props, and large color blocks. It then rebuilds the image with extremely sparse geometry, broken proportions, stiff rigging, local clipping, crude faces, tiny repeated diffuse textures, reused assets, naive lighting, and cheap rendering. The deliverable is an edited image, followed by a lightweight prompt asking whether to continue into a short video; it can also provide a video-ready prompt or production prompt when requested. It is best for primitive folk CGI, bootleg CGI, and reverse-viral low-quality aesthetics; it does not create simple pixelation, VHS filters, horror deformation, ordinary polished low-poly illustration, or smooth cinematic animation."
desc-cn: "面向想把源图转成“制作能力不足”的早期3D效果的创作者，而不是做精致低模艺术。Skill 会先引导用户上传照片或源图；除非用户明确要求生成新场景，否则先基于图片提取主体数量、布局、动作、镜头、场景类型、主要道具和大色块等锚点，再用极低面数、失真比例、僵硬绑定、局部穿模、粗糙脸部、低分辨率重复贴图、复用资产、朴素灯光和廉价渲染进行重建。最终先交付编辑图，并轻量询问是否继续生成短视频；也可在用户要求时交付视频可用提示词或生产提示词。适合 primitive folk CGI、bootleg CGI 和反向出圈低画质审美，不用于普通像素化、VHS 滤镜、恐怖变形、常规精致低模插画或顺滑电影动画。"
author-en: "Kido G"
author-cn: "Kido G"
