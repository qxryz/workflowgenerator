structured-info:
  zh-CN:
    summary: 将照片重建为故意粗糙、比例失真且渲染笨拙的早期3D图像，并可延展为低质量运镜短视频。
    best-for:
      - 原始低模
      - 失败美学
      - 笨拙运镜
    how-to-use: 提供源图并说明是否继续视频，先确认需要保留的主体、布局和低模失真强度。
    outputs: 主体锚点分析、低模重建图、风格化编辑提示词与可选笨拙运镜视频。
  en-US:
    summary: Rebuild a source photo as intentionally crude early-3D imagery with distorted proportions and awkward rendering, with an optional motion extension.
    best-for:
      - Primitive Low-poly
      - Failure Aesthetics
      - Awkward Camera
    how-to-use: Provide the source image and whether to continue to video, then confirm protected subject anchors and distortion strength.
    outputs: Subject-anchor analysis, crude 3D image, style-edit prompt, and optional awkward-camera video.
