structured-info:
  zh-CN:
    summary: 根据场景空间和主体参考规划沉浸式第一视角路线，生成连续自然的一镜到底FPV穿越视频。
    best-for:
      - FPV穿越
      - 空间导览
      - 一镜到底
    how-to-use: 提供场景或主体参考与目标时长，先确认画幅、路线难度和第一视角体验。
    outputs: 空间分析、轨迹分镜、运镜提示词、连续FPV视频与质量检查。
  en-US:
    summary: Plan an immersive first-person route from spatial references and produce a continuous, natural one-take FPV tour video.
    best-for:
      - FPV Tours
      - Spatial Walkthroughs
      - One-take Shots
    how-to-use: Provide scene or subject references and target duration, then confirm framing, route difficulty, and first-person experience.
    outputs: Spatial analysis, trajectory storyboard, camera prompts, a continuous FPV video, and quality checks.
