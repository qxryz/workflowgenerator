structured-info:
  zh-CN:
    summary: 将照片转成带极简社交框的3D手办卡，确认后可延展为固定镜头互动动画短片。
    best-for:
      - 3D手办
      - 社交卡片
      - 互动动画
    how-to-use: 提供人物、宠物或角色照片，先确认主体身份、低模风格、社交框文案与互动方向。
    outputs: 主体分析、3D静态卡、互动分镜、固定镜头提示词与可选动画短片。
  en-US:
    summary: Turn a photo into a minimalist social-frame 3D figurine card, then optionally extend it into a locked-camera interaction short.
    best-for:
      - 3D Figurines
      - Social Cards
      - Interactive Motion
    how-to-use: Provide a person, pet, or character photo, then confirm identity, low-poly style, social copy, and interaction direction.
    outputs: Subject analysis, 3D still card, interaction storyboard, locked-camera prompt, and optional short.
