summary-en: "Transforms a photo into a minimalist social-frame 3D figurine card and optionally extends the accepted card into an interactive animation."
summary-cn: "把照片变成极简社交框3D手办卡，确认后可延展为固定镜头互动动画短片。"
desc-en: "For creators who want a portrait, outfit, pet, mascot, or character image transformed into a minimalist social-frame 3D figurine card. The workflow reads identity, facial impression, accessories, outfit, and pose, creates a low-poly soft-vinyl figure with generous card margins and a clean backdrop, then waits for approval. If motion is requested, it offers interaction directions such as face poke, inside-frame dance, hand grab, swipe feedback, or a custom idea, and generates a fixed-camera animation while preserving the frame. MiniMax-H3 is the default video model; an explicitly selected alternative is capability-checked, retried once on failure, then replaced by another available model."
desc-cn: "面向想把人像、穿搭、宠物、吉祥物或角色图转成社交媒体视觉卡片的创作者。流程提取主体身份、脸型印象、配饰、服装结构和姿态，生成低模软胶 3D 手办与极简社交框静态卡片，确认后再根据戳脸、框内跳舞、拉手、滑动反馈或自定义想法设计互动方向。视频默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败针对原因重试一次后切换其他可用模型。动画保持外层边框和主体身份稳定，适合短视频分享，不用于复杂多镜头剧情。"
