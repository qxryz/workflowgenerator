summary-en: "Turns a subject visual into an approved material-journey poster with protected layout, controlled motion, and social variants."
summary-cn: "从主体视觉确认关键画面，制作保护版式的材质蔓延动态海报并输出社媒变体。"
desc-en: "For designers and creators who want a subject image, poster, or product visual to become a controlled material-propagation package. The workflow identifies the visual anchor and protected regions, defines the material origin, route, timing, stopping rule, and loop, confirms a still key art, and then creates a restrained motion poster with social-format variants. It preserves identity, geometry, typography, lighting, and layout. MiniMax-H3 is the default video model; an explicitly selected alternative is capability-checked, retried once on failure, then replaced by another available model. Not for ordinary static posters, subtitle editing, generic image-to-video, or standard cutting."
desc-cn: "面向设计师与动态海报创作者，把主体图、海报或产品视觉转成可控的材质蔓延制作包。流程先识别视觉锚点与保护区域，明确材质起点、传播路径、时间节奏、停止规则和循环方式，确认静态关键画面后，再生成克制的动态海报与社媒比例变体。整个过程保留主体身份、几何结构、文字、光影和版式。视频默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败针对原因重试一次后切换其他可用模型。不用于普通静态海报、纯字幕、通用图生视频或常规剪辑。"
