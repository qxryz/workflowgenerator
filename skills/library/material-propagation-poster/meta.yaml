structured-info:
  zh-CN:
    summary: 将主体视觉中的材质蔓延路径、保护区域和循环节奏设计成可控的动态海报及社媒变体。
    best-for:
      - 材质蔓延
      - 动态海报
      - 版式保护
    how-to-use: 提供主体图或海报和材质参考，先确认视觉锚点、传播起点、停止规则与循环方式。
    outputs: 关键画面、蔓延路径、动态海报提示词、社媒比例变体与交付说明。
  en-US:
    summary: Design a controllable motion poster from a subject visual by specifying material spread, protected areas, timing, and looping variants.
    best-for:
      - Material Spread
      - Motion Posters
      - Layout Protection
    how-to-use: Provide the subject visual or poster and texture reference, then confirm anchors, start point, stop rule, and loop behavior.
    outputs: Keyframes, spread path, motion-poster prompts, social-ratio variants, and delivery notes.
