structured-info:
  zh-CN:
    summary: 将服装参考分阶段转成锁定规格、资产一致且具有场景叙事的时装展示视频。
    best-for:
      - 服装展示
      - 时装画册
      - 场景造型
    how-to-use: 提供服装照片或穿搭概念，先锁定画幅、时长、套装范围与展示目标。
    outputs: 服装结构分析、模特与场景卡、六宫格分镜、配乐与时装成片。
  en-US:
    summary: Turn garment references into a specification-locked fashion showcase with consistent assets and scene-led styling.
    best-for:
      - Fashion Showcases
      - Lookbooks
      - Styled Scenes
    how-to-use: Provide garment photos or a styling concept, then lock framing, duration, outfit scope, and showcase goal.
    outputs: Garment analysis, model and scene cards, a grid storyboard, music, and finished fashion videos.
