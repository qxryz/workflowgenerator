summary-en: "Turns garment references into staged showcase videos by locking specifications, confirming assets, previewing storyboards, and delivering a 30-second cut."
summary-cn: "把服装参考分阶段编排成时装展示视频，锁定规格、确认资产并输出30秒成片。"
desc-en: "For fashion teams, designers, and creators who need a repeatable showcase pipeline from garment photos, lookbook references, or a clothing brief. The workflow locks a final specification, analyzes garment structure and fabric behavior, confirms technical outfit sheets, model cards, scenes, and a six-panel storyboard, then generates one complete 30-second showcase per outfit with music and assembly. MiniMax-H3 is the default video model; an explicitly selected alternative is checked for capability, retried once on failure, and then replaced with another available model. Best for runway-style showcases and lookbooks, not simple retouching, generic product ads, or unrelated narrative shorts."
desc-cn: "面向服装团队、设计师和创作者，把服装照片、Lookbook 参考或穿搭 brief 转成可复用的时装展示视频流程。系统先锁定最终规格，分析服装结构与面料物理，分步确认刀版图、模特服饰卡、场景候选和六宫格分镜，再按每套服装生成完整 30 秒成片，并完成配乐与组装。视频默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败针对原因重试一次后切换其他可用模型。适合秀场展示、生活方式 Lookbook 和服装场景视频，不负责简单修图、泛品类广告或无关剧情短片。"
