structured-info:
  zh-CN:
    summary: 将故事文案转成具有羊毛毡材质、旁白对白时间轴和阶段确认的连续故事短片。
    best-for:
      - 羊毛毡动画
      - 故事短片
      - 语音时间轴
    how-to-use: 提供故事文案或剧本及可选角色场景参考，先确认画幅、声音结构和成片版本。
    outputs: 羊毛毡角色场景、故事板、语音时间轴、自然音效与可选配乐成片。
  en-US:
    summary: Turn story copy into a continuous wool-felt short with a narration and dialogue timeline and approval gates at each stage.
    best-for:
      - Wool-felt Animation
      - Story Shorts
      - Voice Timelines
    how-to-use: Provide story copy or a script with optional character and scene references, then confirm framing, sound structure, and delivery versions.
    outputs: Wool-felt character and scene assets, storyboard, voice timeline, natural sound, and an optional music version.
