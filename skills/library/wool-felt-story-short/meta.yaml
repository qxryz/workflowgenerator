summary-en: "Turns story copy into a gated wool-felt short with locked format and image/video resolution choices, non-overlapping narration and dialogue timing, reusable visual assets, validated shot audio, and separate final cuts."
summary-cn: "将故事文案转为分阶段确认的羊毛毡短片，锁定画幅、图片与视频清晰度、旁白音色和非重叠音频时间轴，并交付独立成片。"
desc-en: "For creators turning narration, scripts, or story copy into portrait or landscape wool-felt story shorts. Users may add character, scene, prop, and style references. The workflow locks an approved aspect ratio, asks for 1K or 2K image assets and 768P or 2K video, builds reusable felt elements, plans narration and dialogue without unintended overlap, reviews shots one at a time, preserves natural sound effects, and assembles a no-BGM cut before offering a separate BGM version. MiniMax-H3 is the default video model; an explicitly selected alternative is capability-checked, retried once for the diagnosed failure, then replaced by another available model. Best for realistic-scale felt worlds and continuity-sensitive stories, not standalone images, one-off clips, realistic commercials, miniature dioramas, puppet stages, or toy displays."
desc-cn: "面向把旁白、脚本或故事文案制作成竖版或横版羊毛毡短片的创作者，可补充角色、场景、道具和风格参考。流程先锁定画幅，并在相应生成节点确认图片与视频清晰度；随后建立可复用羊毛毡元素，规划纯旁白、纯对白或混合模式的非重叠音频时间轴，逐镜生成并确认画面、原声对白和环境音，先合成无 BGM 成片，再按需输出独立配乐版。视频默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败按原因重试一次后切换可用模型。适合现实比例羊毛毡叙事，不用于单图、写实广告或微缩玩偶舞台。"
