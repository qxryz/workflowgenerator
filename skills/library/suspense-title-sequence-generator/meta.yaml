structured-info:
  zh-CN:
    summary: 将悬疑电影设定、参考素材和准确署名锚定为复古美学关键帧，再生成十五秒片头成片。
    best-for:
      - 悬疑片头
      - 复古美学
      - 关键帧叙事
    how-to-use: 提供电影设定、片名、署名和参考图，先确认片头信息、六个镜头锚点与视觉气质。
    outputs: 电影信息表、六张关键帧提示词、署名设计、镜头提示词与悬疑片头视频。
  en-US:
    summary: Anchor a suspense-film setting, references, and exact credits in retro-styled keyframes before producing a fifteen-second title sequence.
    best-for:
      - Suspense Titles
      - Retro Aesthetics
      - Keyframe Narratives
    how-to-use: Provide the film setting, title, credits, and references, then confirm title data, six shot anchors, and visual tone.
    outputs: A film fact sheet, six keyframe prompts, credit design, shot prompts, and the suspense title video.
