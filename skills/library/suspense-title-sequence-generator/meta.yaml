summary-en: "Anchors keyframes and credits to generate a suspense-aesthetic film opening."
summary-cn: "根据电影设定与参考素材锚定关键帧和英文署名，生成十五秒复古悬疑美学片头成片。"
desc-en: "For creators making suspense, crime, noir, or spy-style title sequences, this Skill takes film type, title, logline, cast, optional credits, and reference images. It confirms reference roles, anchors six keyframes, designs readable English credits and beat-driven motion, then generates a 15-second 16:9 suspense-aesthetic opening. It supports retro pop-art collage, hard-edge silhouettes, and limited stylized face reveals, not full trailers or IP/celebrity replication."
desc-cn: "面向制作悬疑、犯罪、黑色电影或间谍风片头的创作者。用户提供电影类型、片名、一句话剧情、演员表、可选署名和参考图后，Skill 会先确认素材角色，再锚定六张关键帧，设计清晰可读的英文署名与节拍动效，最后生成十五秒、十六比九的复古悬疑美学片头。成片强调波普拼贴、硬边剪影、有限人物露出和爵士悬疑节奏，适合作为电影或短片开场，不用于完整剧情预告、长篇叙事或真实 IP 与名人复刻。"
