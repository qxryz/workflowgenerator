structured-info:
  zh-CN:
    summary: 将故事与参考素材转译为原创的中心构图、复古置景和克制奇想短片，并完成音画合成。
    best-for:
      - 对称叙事
      - 复古置景
      - 原创短片
    how-to-use: 提供故事、角色或参考素材，先确认原创边界、规格、视觉方向与叙事核心。
    outputs: 故事简报、视觉方向、角色场景资产、分镜、视频片段、声音与短片成片。
  en-US:
    summary: Translate a story and references into an original short with centered composition, retro design, restrained whimsy, and finished audio-visual assembly.
    best-for:
      - Symmetrical Stories
      - Retro Production
      - Original Shorts
    how-to-use: Provide the story, characters, or references, then confirm originality boundaries, specs, visual direction, and narrative core.
    outputs: A story brief, visual direction, character and scene assets, storyboard, video segments, sound, and finished short.
