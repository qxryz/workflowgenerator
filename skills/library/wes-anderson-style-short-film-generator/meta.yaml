summary-en: "Builds an original symmetry-led narrative short from a confirmed brief, references, storyboards, video segments, sound layers, and final assembly."
summary-cn: "将确认的故事与参考素材转成原创对称叙事短片，完成分镜、视频段、音频与合成。"
desc-en: "For creators who want an original narrative, brand, advertising, or social short built from centered symmetry, storybook staging, measured blocking, restrained retro design, and dry whimsy. The workflow confirms the brief, analyzes references, locks production specifications, creates visual direction and storyboards, generates mapped video segments, adds narration and sound, and assembles a validated film. MiniMax-H3 is the default video model; an explicitly selected alternative is checked for capability first, retried once on failure, then replaced with another available model. It does not copy specific films, shots, characters, dialogue, or an artist's exact signature."
desc-cn: "面向希望制作原创叙事短片、品牌片、广告或社交视频的创作者，核心是中心对称、童话式场面、精确调度、克制复古设计与干冷奇想。流程先确认故事简报和交付规格，再分析参考素材，锁定视觉方向，建立分镜与关键帧，生成有映射关系的视频段，补充旁白、音效和音乐，最后完成合成与校验。视频默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败针对原因重试一次后切换其他可用模型。只做原创转译，不复制具体电影镜头、角色、对白或艺术家的精确个人签名。"
