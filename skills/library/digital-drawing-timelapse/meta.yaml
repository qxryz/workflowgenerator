structured-info:
  zh-CN:
    summary: 将一张数字绘画成品图转成连续的十五秒绘画过程延时视频，突出创作过程和画面还原。
    best-for:
      - 数字绘画
      - 延时摄影
      - 插画展示
    how-to-use: 提供一张成品图和过程提示词，先确认画幅、时长、清晰度与是否保留原提示。
    outputs: 绘画过程提示、连续速涂视频与画面连贯性检查。
  en-US:
    summary: Turn one finished digital artwork into a continuous fifteen-second drawing timelapse that showcases the making process and image fidelity.
    best-for:
      - Digital Drawing
      - Timelapse
      - Illustration Showcases
    how-to-use: Provide one finished image and a process prompt, then confirm framing, duration, clarity, and prompt preservation.
    outputs: Process direction, a continuous speed-painting video, and continuity checks.
