structured-info:
  zh-CN:
    summary: 将照片重绘为插画并与原图合成邮票边框内外双风格画面，再以固定镜头制作自然动效。
    best-for:
      - 邮票合成
      - 照片重绘
      - 固定镜头
    how-to-use: 提供源照片，先确认插画风格、邮票构图以及内外画面需要对齐的建筑或路径。
    outputs: 插画重绘图、邮票复合画面、边界对齐方案与固定镜头动画。
  en-US:
    summary: Restyle a photo, combine it with the original in a dual-style postage-stamp composition, and animate it with a locked camera.
    best-for:
      - Stamp Composites
      - Photo Restyling
      - Locked Camera
    how-to-use: Provide the source photo, then confirm the illustration style, stamp composition, and structures that must align inside and outside the frame.
    outputs: A restyled illustration, stamp composite, boundary-alignment plan, and locked-camera animation.
