summary-en: "Restyles a photo, builds a split postage-stamp composite, and animates the scene with a fixed camera while preserving the frame and style boundary."
summary-cn: "把照片重绘并合成邮票双风格画面，再以固定镜头生成保持边界的动画。"
desc-en: "For creators who want a daily photo turned into a mixed-media postage-stamp animation. The workflow first restyles the source as a naive flat illustration, then composites a centered stamp frame whose interior uses the illustration and exterior keeps the original photo, aligning shared buildings, horizons, or routes. After approval, it animates the scene with a fixed camera while the stamp and style split remain stable. MiniMax-H3 is the default video model; an explicitly selected alternative is capability-checked, retried once on failure, then replaced by another available model. Best for collage-like scenes, not complex acting, multi-shot stories, or pure retouching."
desc-cn: "面向想把日常照片变成有趣分享素材的创作者。流程先将原图重绘为韩式稚拙扁平插画，再以原图为底叠加居中邮票边框，使框内呈插画、框外保留照片，并让共同建筑、地平线或路径在内外准确对齐。静态合成确认后，使用固定镜头让场景自然运动，同时保持邮票框位置和内外画风边界稳定。视频默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败针对原因重试一次后切换其他可用模型。不适合复杂角色表演、多镜头剧情或纯修图。"
