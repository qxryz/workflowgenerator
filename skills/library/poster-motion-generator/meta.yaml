structured-info:
  zh-CN:
    summary: 让上传海报在保持文字、版式和主体关系的前提下产生一镜到底的克制动态，适合社媒传播。
    best-for:
      - 海报动效
      - 版式保护
      - 社媒视频
    how-to-use: 提供最终海报和目标平台，先确认画幅映射、可动元素与必须保持清晰的文字。
    outputs: 海报结构分析、运动方案、视频提示词、动态海报视频与平台版本。
  en-US:
    summary: Animate an uploaded poster in one continuous shot while preserving readable text, layout, and subject relationships for social publishing.
    best-for:
      - Poster Motion
      - Layout Protection
      - Social Video
    how-to-use: Provide the final poster and target platform, then confirm framing, movable elements, and protected text.
    outputs: Poster analysis, motion direction, video prompts, a motion-poster video, and platform variants.
