structured-info:
  zh-CN:
    summary: 将口播逐字稿按语义拆成可审阅的B-roll镜头方案，并在确认后生成对应的视频素材。
    best-for:
      - B-roll规划
      - 口播视频
      - 语义剪辑
    how-to-use: 提供逐字稿、旁白或数据叙述，先按语义分段并确认镜头路线与缺失素材。
    outputs: 语义分段表、B-roll镜头计划、素材清单、已批准提示词与视频素材。
  en-US:
    summary: Turn a transcript or narration into a reviewable semantic B-roll plan and generate the approved supporting video assets.
    best-for:
      - B-roll Planning
      - Talking-head Video
      - Semantic Editing
    how-to-use: Provide the transcript, voiceover, or data-rich narration, then segment it by meaning and confirm the shot route and missing assets.
    outputs: A semantic segmentation table, B-roll plan, asset list, approved prompts, and video assets.
