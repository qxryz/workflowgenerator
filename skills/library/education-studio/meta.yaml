summary-en: "Turn topics, questions, or course material into lesson designs, exercises, and complete teaching videos"
summary-cn: "把主题、题目或课程素材转化为教学设计、练习题组与完整教学视频的一体化工作室"
desc-en: "For teachers, course creators, and knowledge publishers who need to turn a topic, exam question, or raw course material into teachable content. Supports learning-objective design, explanations with worked examples, classroom activities, exercise sets with answer keys, courseware and handout structures, plus full video production from brief, word-for-word narration, per-shot teaching contracts, and storyboards to video generation, sound, subtitles, and final render. Also processes recordings and transcripts into clean lesson notes and knowledge slices."
desc-cn: "面向教师、课程创作者与知识内容团队，把主题、试题、课堂录音或教材素材加工成可教学、可学习、可评量的内容。支持学习目标与路径设计、讲解与例题、课堂活动、题组与答案解析、课件与讲义结构，并覆盖教学视频从需求简报、逐字旁白、逐镜教学合同、分镜规划到视频生成、声音、字幕与最终渲染的完整生产流程。同时支持把课堂录音整理为逐字稿、讲义与知识点切片，适用于课程视频、动态讲题、科普讲解与培训内容制作。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official
structured-info:
  zh-CN:
    summary: 将主题、教材或课堂素材设计成学习路径、练习评量与可观看的教学内容，覆盖从方案到成片。
    best-for:
      - 课程设计
      - 知识讲解
      - 教学视频
    how-to-use: 提供学习对象、主题或教材素材，先确认学习目标、交付形式与评量需求。
    outputs: 教学简报、学习路径、题组与答案、课件结构、旁白脚本及教学视频。
  en-US:
    summary: Turn topics, teaching materials, or classroom inputs into learning paths, assessments, and watchable educational content from plan to delivery.
    best-for:
      - Course Design
      - Knowledge Explainers
      - Teaching Videos
    how-to-use: Provide the learners, topic, or teaching materials, then confirm learning goals, delivery form, and assessment needs.
    outputs: A teaching brief, learning path, exercises with answers, lesson structure, narration script, and educational video.
