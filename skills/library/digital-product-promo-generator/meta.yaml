structured-info:
  zh-CN:
    summary: 把真实产品页面、前端项目或界面参考转成准确呈现功能、运镜、节奏和声音的产品宣传片。
    best-for:
      - 产品演示
      - 界面动效
      - 发布短片
    how-to-use: 提供网页、截图、录屏或前端项目及品牌资料，先确认功能重点、受众和交付规格。
    outputs: 产品事实表、镜头与运镜方案、界面资产、声音设计及宣传片成片。
  en-US:
    summary: Turn a real product page, frontend project, or interface reference into a product film that accurately presents features, camera movement, rhythm, and sound.
    best-for:
      - Product Demos
      - UI Motion
      - Launch Films
    how-to-use: Provide a webpage, screenshots, recording, or frontend project with brand context, then confirm the feature focus, audience, and delivery spec.
    outputs: A product fact sheet, shot and camera plan, interface assets, sound design, and finished promo.
