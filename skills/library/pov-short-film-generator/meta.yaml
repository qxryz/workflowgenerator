summary-en: "Plan strict first-person POV immersive short films."
summary-cn: 将创意、剧本或参考素材规划为严格主角眼睛视角的沉浸式短片制作方案。
desc-en: "This Skill turns concepts, scripts, reference images, or existing clips into strict first-person POV immersive short-film workflows. It locks the protagonist-eye viewpoint, prevents third-person protagonist shots and face exposure, physicalizes visual style choices, and guides specification writing, POV asset planning, storyboard design, clip prompts, quality checks, and assembly guidance for compact short-form scenes."
desc-cn: 面向制作悬疑、生存、恋爱、恐怖、职场或现实题材第一视角短片的创作者。用户提供创意、剧本、参考图或既有片段后，Skill 会锁定主角眼睛视角，把抽象风格转化为可执行的画面规则，依次完成规格书、第一视角资产规划、分镜设计、镜头提示词、质量检查与组装建议。最终交付可执行的沉浸式短片制作方案，并持续排除主角正脸、第三人称主角镜头和纯产品展示；适合紧凑短片，不负责长剧集统筹。
