structured-info:
  zh-CN:
    summary: 将创意、剧本或参考素材转化为严格主角眼睛视角的沉浸式短片规划与可执行镜头方案。
    best-for:
      - 第一视角
      - 沉浸短片
      - 主观镜头
    how-to-use: 提供创意、剧本或参考素材，先确认主角视角、叙事限制、画幅和风格路线。
    outputs: POV核心简报、视觉风格、镜头表、提示词与可选沉浸式短片。
  en-US:
    summary: Turn an idea, script, or reference into an immersive short-film plan locked to the protagonist’s eye-level point of view.
    best-for:
      - First-person POV
      - Immersive Shorts
      - Subjective Camera
    how-to-use: Provide the idea, script, or references, then confirm the protagonist viewpoint, narrative limits, framing, and style route.
    outputs: A POV brief, visual style, shot list, prompts, and an optional immersive short.
