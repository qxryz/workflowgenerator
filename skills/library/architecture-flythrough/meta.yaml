structured-info:
  zh-CN:
    summary: 将建筑和城市参考重建为可编辑空间，通过预演锁定飞行路径并生成风格连贯的建筑展示短片。
    best-for: [建筑展示, 地标漫游, 飞行运镜]
    how-to-use: 提供建筑名称、照片或平面图，先确认模型细节与飞行运镜预演。
    outputs: 可编辑三维工程、高清预演、风格关键帧及飞行成片。
  en-US:
    summary: Reconstruct architecture and city references as editable spaces, approve a flight path through previs, and create a stylistically coherent flythrough.
    best-for: [Architectural Showcases, Landmark Tours, Flying Cameras]
    how-to-use: Provide a building name, photographs, or plans, then approve model details and the camera preview.
    outputs: Editable 3D project, high-resolution previs, style keyframes, and final flythrough video.
