summary-en: "Researches architectural references, builds editable scenes, designs FPV camera moves, and produces 2560×1440 previews and consistent cinematic flythrough videos using an embedded H3 prompt framework."
summary-cn: "主动搜集建筑与城市图片参考，制作可编辑三维场景、高清预演和一致风格飞行视频，支持地标展示与空间漫游。"
desc-en: "Designed for buildings, landmarks, and city scenes, this skill turns requests, photographs, plans, and concept images into continuous flythrough videos. It searches for and examines visual references, asking before generating supplementary designs when essential evidence is missing. It builds editable scenes and provides native 2560×1440 previews for model and camera approval. Three or four styled images cover the beginning, intermediate states, and ending. After consistency checks and user approval, an embedded H3 prompt framework combines the preview and images in all-purpose reference mode. Deliverables include the editable project, preview, style images, production records, and final film. It is not intended for complex character acting or crowd choreography."
desc-cn: "面向建筑、地标与城市场景，将用户需求、照片、平面图和概念图转化为连续飞行视频。主动搜集并查看参考图片，关键资料不足时询问是否生成补充设定，再建立可编辑三维场景。通过原生2560×1440预演确认模型与运镜，生成覆盖起点、中间状态和终点的三至四张风格图。整组一致性检查与用户确认后，使用内置提示词框架，以全能参考模式生成视频。交付工程、预演、风格图、记录及成片，不适用于复杂角色表演或群演调度。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
source: official-featured
