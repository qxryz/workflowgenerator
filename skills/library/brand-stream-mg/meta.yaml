structured-info:
  zh-CN:
    summary: 从Logo与品牌主题提炼IP化视觉线索，生成流线、节点和品牌字形驱动的MG动效短片。
    best-for:
      - Logo动效
      - 品牌MG
      - 新品预热
    how-to-use: 提供Logo、品牌名和主题词，先确认IP主角、卖点文字和流线运动方向。
    outputs: 品牌视觉简报、IP与流线设定、动效提示词及品牌短片。
  en-US:
    summary: Turn a logo and brand theme into an IP-led motion graphic built from flowing lines, nodes, and branded wordforms.
    best-for:
      - Logo Motion
      - Brand MG
      - Launch Teasers
    how-to-use: Provide the logo, brand name, and theme, then confirm the IP lead, selling-point text, and flow direction.
    outputs: A visual brief, IP and flow direction, motion prompts, and a brand short.
