structured-info:
  zh-CN:
    summary: 将小物产品图包装成真实摄影融合马克笔涂鸦的竖版POP海报，并延展为固定镜头制作动画。
    best-for:
      - 手绘POP
      - 小物广告
      - 制作动画
    how-to-use: 提供小物产品图和品牌或文案要求，先确认标题、贴纸策略、底部文字与画幅。
    outputs: 产品海报、贴纸与文字排版、固定镜头提示词及制作动画。
  en-US:
    summary: Turn a small product image into a vertical hand-drawn POP poster blending product photography with marker doodles, then animate its making.
    best-for:
      - Hand-drawn POP
      - Small Product Ads
      - Making-of Motion
    how-to-use: Provide the small-product image and brand or copy needs, then confirm title, sticker strategy, bottom text, and framing.
    outputs: A product poster, sticker and type layout, fixed-camera prompt, and making-of animation.
