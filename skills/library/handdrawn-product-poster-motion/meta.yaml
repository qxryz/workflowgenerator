summary-en: "Transforms a small product photo into a hand-drawn POP poster and a seven-second making-of animation through confirmed title, stickers, and footer copy."
summary-cn: "把小物产品图制作成手绘POP海报与7秒制作动画，分步确认标题、贴纸和底部文案。"
desc-en: "For creators presenting drinks, cosmetics, phones, earbuds, snacks, stationery, toys, and other hand-holdable products. The Skill confirms the product title, sticker strategy, and optional footer copy in separate checkpoints, loads bundled poster references, creates a vertical POP poster combining realistic product photography with marker doodles and illustrated hands, then animates the making process. MiniMax-H3 is the default video model; an explicitly selected alternative is capability-checked, retried once when it fails, and then replaced by another available model. Not for large products, talking-head commerce, UI demos, luxury cinematic campaigns, or long narrative ads."
desc-cn: "面向需要把饮品、美妆、手机、耳机、零食、文具、潮玩等小物快速包装成年轻视觉的创作者。Skill 按检查点确认产品标题、贴纸策略和可选底部小字，调用内置海报提示词生成真实产品摄影融合马克笔涂鸦、插画双手与彩色贴纸的竖版 POP 海报，再把制作过程延展为 7 秒固定镜头动画。视频默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败针对原因重试一次后切换其他可用模型。适合小物展示，不适合大型产品、真人带货、UI 演示、高奢电影广告或长剧情。"
