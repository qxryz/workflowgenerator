summary-en: "Turn a story or script into a guided 3D manhua short-drama package with dialogue video and separate narration audio."
summary-cn: "把故事或剧本整理成含对白视频和独立旁白音频的可剪辑3D漫剧短剧制作包。"
desc-en: "For creators developing a 3D manhua short drama from a premise, script fragment, reference image, or existing assets. Confirm the story and delivery choices, reconcile every source beat, reserve narration and dialogue windows, build reusable character and scene anchors, generate measured audio and image-to-video shots, then assemble a dialogue-only video in the approved order. Deliver narration, its transcript, and placement timing as a separate package for user-led editing. The workflow prioritizes continuity and clear review gates. Best for short episodic 3D manhua; not live action, pure 2D animation, narrated master mixing, or long-form series planning."
desc-cn: "面向需要制作 3D 漫剧短剧的创作者，可从故事、剧本片段、参考图或已有素材开始。Skill 先确认剧情与交付选项，完成剧本对账，在分镜阶段预留旁白和对白时间窗，建立角色与场景锚点，生成定时音频和图生视频镜头，再按确认顺序拼接无旁白对白视频。旁白作为独立音频包交付，方便用户自行剪辑。适合短篇连续 3D 漫剧；不负责真人实拍、纯二维动画、旁白混音母版或长篇系列统筹。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
