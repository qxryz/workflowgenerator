structured-info:
  zh-CN:
    summary: 将故事或剧本整理成旁白推进、对白补充的连续3D漫剧制作包，支持后续剪辑与配音。
    best-for:
      - 3D漫剧
      - 半解说短剧
      - 连续性制作
    how-to-use: 提供故事或剧本、角色参考和类型偏好，先确认起始路径、画幅、时长与声音结构。
    outputs: 角色场景资产、双通道脚本、分镜、对白视频、独立旁白音频与剪辑包。
  en-US:
    summary: Turn a story or script into a continuous 3D manhua package driven by narration and supported by character dialogue for editing.
    best-for:
      - 3D Manhua
      - Narrated Drama
      - Continuity Production
    how-to-use: Provide the story or script, character references, and genre preference, then confirm the start path, framing, duration, and sound structure.
    outputs: Character and scene assets, a two-channel script, storyboard, dialogue video, standalone narration audio, and an edit package.
