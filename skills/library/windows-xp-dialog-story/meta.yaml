structured-info:
  zh-CN:
    summary: 将Windows XP复古弹窗、角色动作和系统状态编排成可读且有因果收束的视觉叙事短剧。
    best-for:
      - 复古弹窗
      - 视觉叙事
      - 系统状态
    how-to-use: 提供创意、弹窗素材或角色参考，先确认静态图或视频路线、状态序列与文字内容。
    outputs: 弹窗设计、状态时间线、角色动作、声音方案与视觉短剧成片。
  en-US:
    summary: Arrange Windows XP dialog states, character actions, and system events into a readable visual short with clear causality and resolution.
    best-for:
      - Retro Dialogs
      - Visual Storytelling
      - System States
    how-to-use: Provide the concept, dialog assets, or character references, then confirm still or video route, state sequence, and exact text.
    outputs: Dialog designs, state timeline, character actions, sound direction, and the finished visual short.
