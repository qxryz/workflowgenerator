summary-en: "Offer three reference-grounded style directions when needed, then turn one product photo into a chosen-ratio poster, four lighting studies, and a coherent 10–15-second product advertisement."
summary-cn: "未指定风格时先基于参考内容提供三个方向，再按用户选择的画幅制作海报、四张光位图和10–15秒广告；未指定时长时先询问确认。"
desc-en: "For creators and product teams building beverage or packaged-product advertising from one clear product photograph. Users choose 9:16, 3:4, 4:5, or 16:9 framing and may supply copy, audience, channel, or colors. If style is unspecified, three reference-grounded directions are proposed; missing duration is confirmed before production. The workflow checks bundled sources, validates a structured poster specification, creates a master poster and four independent lighting studies, then writes a duration-adapted five-phase brief and generates the commercial while preserving package identity. Deliverables include the poster, lighting images, video, and available intermediate text. It supports reference-faithful advertising, not package redesign, unrelated retouching, long films, or multi-clip editing."
desc-cn: "面向用清晰产品原图建立饮品或包装产品广告的创作者与产品团队，接收产品照片和可选的渠道、文案、受众或配色要求。用户从竖屏、方近竖幅或横屏规格中选择画幅；未指定风格时先给出三个参考方向，未指定时长时先确认。流程检查随附资源，生成并校验结构化海报规格，制作主海报与四张独立光位图，再编写适配时长的五段视频方案并生成广告，全程保留包装身份。交付海报、光位图、视频与可用中间文本，适合产品广告，不处理包装重设计、无关修图、长篇影片或多段剪辑。"
author-en: "里大猫"
author-cn: "里大猫"
source: community
