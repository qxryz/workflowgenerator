structured-info:
  zh-CN:
    summary: 以一张产品原图建立统一广告视觉，通过海报与独立光位参考保持包装身份并生成动态产品短片。
    best-for: [饮品广告, 包装产品, 动态海报]
    how-to-use: 上传清晰产品照片，选择海报画幅并确认风格方向与广告时长。
    outputs: 产品主海报、四张独立光位参考图及动态广告视频。
  en-US:
    summary: Build a coherent campaign from one product photograph, using a poster and independent lighting references to preserve packaging identity in motion.
    best-for: [Beverage Advertising, Packaged Products, Dynamic Posters]
    how-to-use: Upload a clear product photo, choose framing, and confirm the style direction and advertisement duration.
    outputs: Master product poster, four independent lighting reference images, and a dynamic advertisement video.
