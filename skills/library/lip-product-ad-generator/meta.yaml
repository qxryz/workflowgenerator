structured-info:
  zh-CN:
    summary: 将唇部产品与品牌需求编排为横屏彩妆TVC，先锁定模特、静物和脚本，再完成自然互动成片。
    best-for:
      - 彩妆TVC
      - 唇部产品
      - 产品互动
    how-to-use: 提供唇部产品图、品牌要求和可选模特方向，先确认产品身份、画幅与叙事重点。
    outputs: 模特图、产品静物图、脚本、镜头计划、视频片段与彩妆广告成片。
  en-US:
    summary: Shape a lip product and brand brief into a horizontal beauty TVC by locking the model, still life, and script before production.
    best-for:
      - Beauty TVCs
      - Lip Products
      - Product Interaction
    how-to-use: Provide product images, brand requirements, and optional model direction, then confirm product identity, framing, and narrative focus.
    outputs: A model image, product still life, script, shot plan, video segments, and finished beauty ad.
