summary-en: "Builds a 30s horizontal lip-product TVC in a fixed order, requiring model portrait, 3×3 still-life, and storyboard files before video generation, while using the still-life only as storyboard reference and keeping interactions natural."
summary-cn: "按固定顺序生成横屏30秒唇部彩妆TVC，先完成模特图、3×3静物图和脚本文件再生成视频，并强化自然的人物与产品、道具互动。"
desc-en: "For creators making lipstick, lip gloss, lip tint, lip mud, lip oil, lip glaze, or other lip-product commercials from scratch or from uploaded references. It follows a fixed workflow: generate the model portrait, generate a 3×3 product still-life using the canvas still-life prompt, write or refine the storyboard, produce storyboard-accurate shot-level video segments only after all three files exist, using the still-life only as storyboard reference and requiring natural model/product/prop interaction beats, add background audio, and then composite and validate the final 30s TVC. It keeps model identity and product presentation consistent, supports segment-level regeneration, and stays brand-agnostic, texture-agnostic, packaging-agnostic, and lip-format-agnostic when the references are broad. It is best for H3-style horizontal beauty ads and does not cover generic beauty reels, skincare, eye makeup, or silent video-only delivery."
desc-cn: "面向需要从零开始制作口红、唇釉、唇泥、唇蜜、唇油、唇釉唇泥综合类或其他唇部广告的创作者。它固定按照模特图、3×3 静物图、分镜脚本、脚本级小分段视频、背景音乐、最终合成校验的顺序执行；静物图必须严格跟随画布静物图提示词，视频必须在模特图、3×3静物图和脚本文件完成后生成，静物图仅作分镜参考，视频按脚本拆段，并强制加入自然灵动的人物和产品互动、产品质感与道具对比、人物和道具互动镜头，保证模特身份和产品呈现一致，支持按段重做，也能在参考较泛时保持品牌、质地、包装和产品形式都可泛化。它最适合 H3 横屏美妆广告，不适合泛美妆混剪、护肤、眼妆或无背景音的纯视频交付。"
