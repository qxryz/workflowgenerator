structured-info:
  zh-CN:
    summary: 根据双人玩家信息、角色参考和视觉风格制作先确认首图、再进入游戏世界的合作游戏开场动画。
    best-for:
      - 双人游戏
      - 菜单开场
      - 角色联动
    how-to-use: 提供两位玩家名称、游戏标题、风格和可选角色图，先确认菜单首图中的身份与布局。
    outputs: 菜单确认图、玩家信息卡、时间线提示词及双人开场视频。
  en-US:
    summary: Create a co-op game opening that uses player data, character references, and a confirmed menu image before entering the game world.
    best-for:
      - Co-op Games
      - Menu Openings
      - Character Pairing
    how-to-use: Provide two player names, the game title, style, and optional character art, then approve the identity and layout of the menu anchor.
    outputs: A menu anchor image, player cards, timeline prompts, and a two-player opening video.
