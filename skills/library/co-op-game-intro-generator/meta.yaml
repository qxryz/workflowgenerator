summary-en: Create a reusable co-op game menu intro from player names, visual style, character references, and one approved confirmation image.
summary-cn: 根据玩家名称、视觉风格和角色参考图，经首图确认后生成双人游戏菜单开场视频。
desc-en: This Skill is for creators who want a repeatable, platform-ready workflow for two-player co-op game menu intros and opening animations. The user provides PLAYER 1 and PLAYER 2 names, a game title, a desired visual style, and optional character reference images. The workflow first maps identity cues without inheriting unwanted source-image realism, fills a fixed confirmation-image template, generates one 16:9 menu approval image, waits for user approval, then refills an H3 video prompt from the approved image, player data, UI copy, timing events, motion directions, and negative constraints. The final deliverable is a co-op game intro video featuring two characters, player cards, menu interaction, equipment configuration, loading, and world-entry motion. It is best for game concept videos, social media openings, and character-led menu animation, not for playable game development, complex multi-page UI systems, exact commercial logo replication, or generic character-free title sequences.
desc-cn: 本 Skill 面向需要反复制作双人合作游戏主菜单或开场动画的创作者，并已整理为平台可发布结构。用户提供 PLAYER 1 与 PLAYER 2 名称、游戏标题、目标视觉风格，并可上传角色参考图。流程会先提取身份锚点但避免继承原图写实质感，再填写固定确认首图模板，生成一张 16:9 菜单确认图；用户批准后，基于确认图、玩家信息、UI 文案、时间线事件、运动方向和负面约束回填 H3 视频提示词。最终输出包含双人角色、玩家信息卡、菜单交互、装备配置、加载和进入游戏世界的开场视频。适用于游戏概念展示、社交内容和角色化菜单动效，不处理可玩游戏开发、复杂多页面 UI、精确商业 Logo 复刻或无角色通用片头。
