structured-info:
  zh-CN:
    summary: 将未来科幻故事编排为人物、物种、道具和场景资产，再生成连续的写实影视短片。
    best-for:
      - 未来科幻
      - 写实短片
      - 世界观资产
    how-to-use: 提供科幻故事、角色设定或参考素材，先锁定创意简报、视觉质感与叙事范围。
    outputs: 人物与场景锚点、道具资产、分镜、视频片段、音画合成与科幻短片。
  en-US:
    summary: Turn a future science-fiction story into character, species, prop, and scene assets before producing a continuous live-action-style short.
    best-for:
      - Future Sci-fi
      - Live-action Shorts
      - World-building Assets
    how-to-use: Provide the sci-fi story, character direction, or references, then lock the brief, visual realism, and narrative scope.
    outputs: Character and scene anchors, prop assets, storyboard, video segments, audio-visual assembly, and the finished short.
