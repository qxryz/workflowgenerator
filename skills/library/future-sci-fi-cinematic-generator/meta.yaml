summary-en: "Turns a confirmed future-sci-fi brief into continuity-safe characters, scenes, storyboards, timed video segments, and an assembled realistic short film."
summary-cn: "将确认的未来科幻故事转为连续的人物场景资产、分镜、分段视频和写实短片成片。"
desc-en: "For creators who need a realistic live-action future science-fiction short from a story brief. Provide a synopsis, optional character or scene references, duration, paragraph count, aspect ratio, language, and style preference. The workflow locks the visual direction, audits references, builds complete character, species, prop, and scene assets, binds them to a continuity storyboard, generates timed video segments, and assembles the approved film. MiniMax-H3 is the default video model; if the user explicitly selects another model, check its capabilities first, retry a failed segment once for the diagnosed cause, then switch to another available model. Best for one 16:9 narrative short; not for anime or game PVs, cyberpunk-first pieces, music videos, title sequences, or simple image-to-video motion."
desc-cn: "面向需要制作超写实真人未来科幻短片的创作者。用户提供故事梗概、人物或场景参考图、时长、段落数、画幅和风格偏好。流程先锁定视觉方向与规格，再建立人物、物种、道具和场景资产，制作连续性分镜，分段生成并按时间轴合成成片。默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败按原因重试一次后切换可用模型。适合16:9叙事科幻短片，不适合二次元、赛博朋克主导、音乐视频、片头标题序列或简单图生视频。"
author-en: "MiniMax Design"
author-cn: "MiniMax Design"
