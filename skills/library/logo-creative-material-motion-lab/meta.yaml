summary-en: "Builds a logo motion package with paired 3D bases, three material directions, and horizontal and vertical video variants."
summary-cn: "以Logo和参考图生成3D基底、三种材质方向及横竖版品牌动效视频，适合TVC与社媒切条。"
desc-en: "For designers, brand teams, and motion creators who need a structured logo motion package. The workflow pairs one logo with one reference image to create 3D material bases, writes three distinct directions with horizontal and vertical prompts, then generates six short videos with MiniMax-H3 by default. If the user explicitly chooses another model, its capabilities are checked first; a failure is retried once for the diagnosed cause, then moved to another available model. The package is suited to brand reveals, TVC openers, and social cutdowns, not unrelated editing or long-form story planning."
desc-cn: "适用于设计师、品牌团队和动效创作者的结构化 Logo 动效流程。用户提供 Logo、品牌名、品牌调性和可选参考图后，Skill 坚持一张 Logo 配一张参考图，逐一生成 3D 材质基底，整理三条互相区分的材质动效方向，每条包含横版与竖版提示词，最后默认使用 MiniMax-H3 生成 6 条短视频。用户明确指定其他模型时先检查能力，失败针对原因重试一次后切换其他可用模型。适合品牌开场、TVC 和社媒切条，不负责无关剪辑或长篇叙事。"
