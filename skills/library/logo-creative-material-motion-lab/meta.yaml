structured-info:
  zh-CN:
    summary: 从Logo与参考图生成三维材质基底和三条差异化动效方向，再输出横竖版品牌短视频。
    best-for:
      - Logo材质
      - 品牌动效
      - TVC切条
    how-to-use: 提供Logo、品牌名、品牌调性和参考图，先确认每组Logo与参考的对应关系及材质方向。
    outputs: 3D Logo基底、三种材质方案、横竖版提示词与六条品牌动效视频。
  en-US:
    summary: Create 3D logo material bases and three distinct motion directions from a logo and references, then deliver horizontal and vertical brand shorts.
    best-for:
      - Logo Materials
      - Brand Motion
      - TVC Cutdowns
    how-to-use: Provide the logo, brand name, tone, and references, then confirm each logo-reference pairing and material direction.
    outputs: 3D logo bases, three material directions, horizontal and vertical prompts, and six brand motion videos.
