structured-info:
  zh-CN:
    summary: 将IP角色制作成六宫格3D潮玩海报，并延展为保持格面和角色身份的竖版动态视频。
    best-for:
      - IP潮玩
      - 六宫格海报
      - 社媒动效
    how-to-use: 提供角色图或IP设定，先确认六个格子的动作、道具、文字与整体画幅。
    outputs: 六宫格静态海报、格面动效方案、3D潮玩短片与社媒交付素材。
  en-US:
    summary: Turn an IP character into a six-panel 3D toy poster and extend it into a vertical motion piece that preserves identity and panel layout.
    best-for:
      - IP Toys
      - Six-panel Posters
      - Social Motion
    how-to-use: Provide the character image or IP direction, then confirm each panel’s action, prop, text, and overall framing.
    outputs: A six-panel still poster, panel-motion direction, 3D toy short, and social delivery assets.
