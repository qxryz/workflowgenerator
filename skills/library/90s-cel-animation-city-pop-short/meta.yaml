structured-info:
  zh-CN:
    summary: 将剧情与视觉参考转化为角色场景连续、分段清晰并带City Pop声画设计的复古都市赛璐璐动画短片。
    best-for:
      - 复古都市
      - 赛璐璐动画
      - 城市短片
    how-to-use: 提供故事、人物场景参考与可选音频，确认时长、画幅、主导城市风格和时间轴。
    outputs: 风格母版、角色场景资产、分段分镜、音效配乐及动画成片。
  en-US:
    summary: Turn stories and visual references into a continuous retro urban cel-animation short with segmented storytelling and City Pop sound design.
    best-for:
      - Retro Cities
      - Cel Animation
      - Urban Shorts
    how-to-use: Provide the story, character and scene references, and optional audio, then confirm duration, framing, dominant city style, and timeline.
    outputs: A style master, character and scene assets, segment storyboards, sound design, music, and the finished animation.
