summary-en: "Turns stories and visual references into connected 1990s cel-animation City Pop shorts with locked style, continuity assets, segment storyboards, music, sound design, and final editing."
summary-cn: "将剧情与视觉参考转化为统一风格、连续资产、分段分镜、音乐拟音和剪辑完整的复古都市赛璐璐动画短片。"
desc-en: "For creators making 30–90 second horizontal urban animation shorts inspired by Japanese 1990s flat graphic cel animation and City Pop. Users provide a story, character or scene images, reference videos, and optional audio. The workflow analyzes source roles, locks a Style Master and timeline, builds reusable characters, props, and environments, prepares one 2×2 storyboard per narrative segment, generates approved video segments, then adds music, urban sound, transitions, and a unified edit. MiniMax-H3 is the default video model; an explicitly selected alternative is capability-checked, retried once for the diagnosed failure, then replaced by another available model. Best for travel impressions, city memories, landmarks, transit, and urban montages; not still images, simple i2v, subtitle-only work, full music videos, game PVs, or projects over 90 seconds."
desc-cn: "面向制作30–90秒、16:9横屏复古都市动画的创作者，把剧情、人物或场景图片、参考视频和可选音频转化为日本90年代平面图形化赛璐璐 City Pop短片。流程先分析素材作用并锁定 Style Master 与时间轴，再建立人物、道具和场景资产，为每个剧情段制作并确认一张2×2分镜，随后逐段生成视频，加入音乐、城市拟音、转场并统一剪辑。视频默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败按原因重试一次后切换可用模型。适合旅行印象、都市记忆、地标与交通蒙太奇，不用于静图、简单图生视频、完整长 MV、游戏 PV 或超过90秒项目。"
