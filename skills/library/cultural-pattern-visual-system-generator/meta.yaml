summary-en: "Extracts cultural motifs into pattern masters, repeats, colorways, product mockups, packaging, wallpapers, and a short motion showcase."
summary-cn: "从文化装饰提取纹样，分步生成母版、连续纹样、配色、样机、包装、壁纸与动效。"
desc-en: "For cultural brands, designers, and creative teams that want to turn architectural, folk-craft, tile, ironwork, wall, gate, or ornamental references into a reusable visual system. The Skill processes each reference independently, producing motif masters, clean extraction masters, seamless repeats, four labeled colorways, category-matched product mockups, packaging, cultural merchandise, wallpapers, and a short motion showcase. MiniMax-H3 is the default video model; an explicitly selected alternative is capability-checked, retried once when needed, then replaced by another available model. It is for pattern extraction and brand extension, not full brand strategy or long campaign production."
desc-cn: "面向文创品牌、设计师和创意团队，将建筑、民艺、花砖、铁艺、墙体、柱子、门窗等装饰参考转化为可复用的视觉系统。Skill 严格分步处理每张参考图，依次生成独立纹样母版、白底提取母版、连续纹样、四套带十六进制标注的配色、匹配品类的产品样机、包装与文创周边、壁纸和短动效。视频默认使用 MiniMax-H3；用户明确指定其他模型时先检查能力，失败针对原因重试一次后切换其他可用模型。适合纹样提取、文创产品和品牌展示，不替代完整品牌策略或长篇 campaign。"
