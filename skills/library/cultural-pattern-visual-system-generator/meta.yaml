structured-info:
  zh-CN:
    summary: 从文化、建筑或民艺参考提取可复用纹样，并发展为配色、样机、包装、壁纸和动效视觉系统。
    best-for:
      - 文化纹样
      - 视觉系统
      - 文创样机
    how-to-use: 提供文化装饰参考和品牌主题，先确认纹样来源、母版提取范围与应用品类。
    outputs: 纹样母版、连续纹样、配色方案、产品与包装样机、壁纸及动效资产。
  en-US:
    summary: Extract reusable motifs from cultural, architectural, or craft references and develop them into a visual system with applications and motion.
    best-for:
      - Cultural Motifs
      - Visual Systems
      - Cultural Mockups
    how-to-use: Provide cultural ornament references and a brand theme, then confirm motif sources, master extraction scope, and application categories.
    outputs: Master motifs, repeating patterns, color systems, product and package mockups, wallpapers, and motion assets.
