name: Release WorkflowGenerator for macOS

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri -> target

      - name: Check release version
        working-directory: web
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "$(cat ../VERSION)"
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: web
          tagName: ${{ github.ref_name }}
          releaseName: WorkflowGenerator ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
