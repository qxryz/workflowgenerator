name: Build WG Official Plugins

# 构建插件并把确认过的发布快照更新到本仓库 plugins-dist 分支。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-plugins
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install build dependencies
        working-directory: plugins/canvas/registry
        run: npm install --no-audit --no-fund

      - name: Build official plugins
        working-directory: plugins/canvas/registry
        run: npm run build

      - name: Install signing tool
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Sign official plugin catalog
        working-directory: web
        run: bunx --no-install tauri signer sign ../plugins/canvas/registry/dist/official-plugins.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Keep a downloadable build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wg-official-plugins
          path: plugins/canvas/registry/dist

      - name: Publish plugins-dist snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin plugins-dist
          publish_root="$RUNNER_TEMP/plugins-dist"
          git worktree add --detach "$publish_root" FETCH_HEAD
          git -C "$publish_root" rm -r .
          cp -R plugins/canvas/registry/dist/. "$publish_root/"
          git -C "$publish_root" add -A
          if git -C "$publish_root" diff --cached --quiet; then
            echo "Plugin snapshot is already current."
            exit 0
          fi
          git -C "$publish_root" config user.name "github-actions[bot]"
          git -C "$publish_root" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_root" commit -m "publish WG official plugins"
          git -C "$publish_root" push origin HEAD:plugins-dist
